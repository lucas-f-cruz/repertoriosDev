<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Roteiro Litúrgico Musical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #16130f;
      --ink2: #2a261e;
      --muted: #7a7165;
      --faint: #b0a898;
      --surface: #fffdf8;
      --soft: #faf6ee;
      --paper: #f4efe7;
      --border: rgba(42, 37, 31, .13);
      --border-s: rgba(42, 37, 31, .22);
      --gold: #b88b37;
      --gold-s: #ead7a5;
      --gold-bg: rgba(184, 139, 55, .08);
      --green: #2a7d52;
      --green-bg: rgba(42, 125, 82, .1);
      --blue: #2060a0;
      --blue-bg: rgba(32, 96, 160, .1);
      --danger: #9b3525;
      --r: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
      cursor: pointer;
    }

    svg {
      flex-shrink: 0;
    }

    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* HOME */
    #home {
      background: #fff;
      position: relative;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 2.5rem;
    }

    .staff-bg-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .home-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    .home-kicker {
      color: #aaa;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      font-weight: 400;
    }

    .home-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      color: #111;
      letter-spacing: -2px;
      margin-bottom: .5rem;
    }

    .home-title em {
      font-style: italic;
      color: #666;
      font-weight: 400;
    }

    .home-date {
      font-size: 12px;
      color: #aaa;
      letter-spacing: .6px;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    .home-rule {
      width: 40px;
      height: 1px;
      background: #e5e5e5;
      margin: 0 auto 2rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 10px;
    }

    .menu-btn {
      border-radius: 14px;
      padding: 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, filter .15s;
      text-align: left;
      border: none;
    }

    .menu-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .15);
      filter: brightness(1.04);
    }

    .menu-btn:active {
      transform: translateY(0) scale(.99);
    }

    .menu-btn-wide {
      grid-column: 1/-1;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    .card-novo {
      background: linear-gradient(135deg, #1a1a1a 60%, #2e2e2e);
    }

    .card-rep {
      background: linear-gradient(135deg, #7a3f50 60%, #a0566a);
    }

    .card-ev {
      background: linear-gradient(135deg, #2a5e8a 60%, #3a7fb5);
    }

    .mc-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .mc-icon svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      flex-shrink: 0;
    }

    .menu-btn-wide .mc-icon {
      margin-bottom: 0;
    }

    .mc-label {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: .2px;
    }

    .mc-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, .6);
      line-height: 1.4;
    }

    .menu-util {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 440px;
    }

    .util-card {
      flex: 1;
      background: #fff;
      border: 0.5px solid #e8e8e8;
      border-radius: 12px;
      padding: .7rem 1rem;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      transition: background .13s, border-color .13s, transform .12s, box-shadow .12s;
    }

    .util-card:hover {
      background: #f7f7f7;
      border-color: #ccc;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
    }

    .util-card svg {
      width: 15px;
      height: 15px;
      stroke: #888;
      flex-shrink: 0;
    }

    .util-label {
      font-size: 11px;
      color: #555;
      font-weight: 500;
    }

    /* SUBPAGE SHELL */
    .subpage-header {
      background: var(--ink);
      color: #fff;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: 1px solid rgba(234, 215, 165, .26);
      border-radius: 6px;
      color: var(--gold-s);
      padding: 5px 9px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background .12s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: rgba(234, 215, 165, .09);
    }

    .back-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .subpage-title-block {
      flex: 1;
      min-width: 0;
    }

    .subpage-kicker {
      color: var(--gold-s);
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .subpage-h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(16px, 3vw, 24px);
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subpage-sub {
      display: block;
      color: #c8b880;
      font-size: 11px;
      margin-top: 2px;
      font-weight: 300;
    }

    .hbtn-cluster {
      display: flex;
      gap: 0;
      border: 1px solid rgba(234, 215, 165, .26);
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hbtn {
      background: none;
      color: var(--gold-s);
      border: none;
      border-left: 1px solid rgba(234, 215, 165, .18);
      padding: 6px 10px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background .12s;
    }

    .hbtn:first-child {
      border-left: none;
    }

    .hbtn:hover {
      background: rgba(234, 215, 165, .09);
    }

    .hbtn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hep {
      display: none;
      background: #1e1b16;
      border-bottom: 1px solid rgba(234, 215, 165, .1);
    }

    .hep.open {
      display: block;
    }

    .hep-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 9px 15px;
      display: flex;
      gap: 7px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .hep-f {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 110px;
    }

    .hep-f label {
      color: var(--faint);
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .hep-f input {
      border: 1px solid rgba(234, 215, 165, .24);
      border-radius: 6px;
      background: rgba(255, 253, 248, .06);
      color: #fff;
      padding: 6px 9px;
      outline: none;
      width: 100%;
    }

    .hep-f input:focus {
      border-color: var(--gold);
    }

    .save-hep {
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11px;
      font-weight: 700;
    }

    .hep-color-group {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .hc-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform .12s, border-color .12s;
      flex-shrink: 0;
    }

    .hc-swatch:hover {
      transform: scale(1.2);
    }

    .hc-swatch.hc-sel {
      border-color: #fff;
      transform: scale(1.22);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5);
    }

    .hc-clear {
      background: rgba(255, 253, 248, .1) !important;
      border: 1.5px dashed rgba(234, 215, 165, .4) !important;
    }

    /* REP PAGE */
    .rep-page {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 13px;
      flex: 1;
      overflow-y: auto;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .tl-left {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tl-label {
      font-family: "Cormorant Garamond", serif;
      font-size: 15px;
      font-weight: 600;
    }

    .tl-edit-wrap {
      display: none;
      align-items: center;
      gap: 5px;
    }

    .tl-edit-wrap.open {
      display: flex;
    }

    .tl-edit-wrap input {
      border: 1px solid var(--border-s);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 4px 7px;
      outline: none;
      font-size: 12px;
      width: 140px;
    }

    .tl-right {
      display: flex;
      gap: 0;
      border: 1px solid var(--border-s);
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tlbtn {
      background: rgba(255, 253, 248, .8);
      color: var(--muted);
      border: none;
      border-left: 1px solid var(--border);
      padding: 5px 9px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background .12s, color .12s;
    }

    .tlbtn:first-child {
      border-left: none;
    }

    .tlbtn:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .tlbtn.gold {
      color: var(--gold);
      font-weight: 600;
    }

    .tlbtn svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* SONG ROW */
    .repertoire {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .song-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      transition: border-color .14s, box-shadow .14s;
    }

    .song-row:hover {
      border-color: rgba(184, 139, 55, .3);
      box-shadow: 0 2px 8px rgba(24, 22, 18, .07);
    }

    .song-row.done {
      opacity: .5;
    }

    .song-row.done .song-title {
      text-decoration: line-through;
      color: var(--faint);
    }

    .song-row.dragging {
      opacity: .4;
      border: 2px dashed var(--gold);
    }

    .song-row.drag-over {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-s);
    }

    /* top row: num + main + tools */
    .song-top {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) auto;
      align-items: stretch;
    }

    .num-block {
      background: linear-gradient(180deg, #27241e, #151310);
      color: #fff;
      border-right: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background .12s;
    }

    .num-block:hover {
      background: linear-gradient(180deg, #332f27, #1e1b15);
    }

    .chk {
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(234, 215, 165, .38);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, border-color .12s;
    }

    .chk svg {
      width: 9px;
      height: 9px;
      stroke: var(--gold-s);
      opacity: 0;
      transition: opacity .12s;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .song-row.done .chk {
      background: var(--gold);
      border-color: var(--gold);
    }

    .song-row.done .chk svg {
      opacity: 1;
    }

    .num-val {
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      line-height: 1;
      font-weight: 600;
    }

    .song-main {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-width: 0;
    }

    .song-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-block;
      border: 1px solid rgba(93, 110, 77, .2);
      background: rgba(93, 110, 77, .07);
      color: #4a5c3c;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tom-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid rgba(184, 139, 55, .3);
      background: rgba(184, 139, 55, .07);
      color: var(--gold);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .12s;
    }

    .tom-badge:hover {
      background: rgba(184, 139, 55, .14);
    }

    .tom-badge.empty {
      color: var(--faint);
      border-color: var(--border-s);
      background: none;
    }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-title.empty {
      color: var(--faint);
      font-style: italic;
      font-weight: 400;
    }

    .vocal-line {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vocal-line strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* row color theming */
    .song-row.row-color .pill {
      background: var(--row-bg);
      border-color: var(--row-border);
      color: var(--row-text);
    }

    .song-row.row-color .num-block {
      border-right-color: var(--row-border);
    }

    .row-color-picker {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .rcp-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .12s, border-color .12s;
      flex-shrink: 0;
    }

    .rcp-swatch:hover {
      transform: scale(1.2);
    }

    .rcp-swatch.rcp-sel {
      border-color: var(--ink);
      transform: scale(1.22);
    }

    .rcp-clear {
      background: none !important;
      border: 1.5px dashed var(--border-s) !important;
    }

    /* right side tools */
    .song-tools {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .tools-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .tools-row+.tools-row {
      border-top: 1px solid var(--border);
    }

    .btn-letra,
    .btn-cifra,
    .btn-edit,
    .btn-clear,
    .btn-drag {
      min-height: 26px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      transition: background .12s, color .12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .btn-letra {
      color: var(--green);
    }

    .btn-letra:hover {
      background: var(--green-bg);
    }

    .btn-cifra {
      color: var(--blue);
      border-left: 1px solid var(--border);
    }

    .btn-cifra:hover {
      background: var(--blue-bg);
    }

    .btn-edit {
      color: var(--muted);
    }

    .btn-edit:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .btn-clear {
      color: rgba(155, 53, 37, .55);
      border-left: 1px solid var(--border);
    }

    .btn-clear:hover {
      background: #fff0ed;
      color: var(--danger);
    }

    /* drag handle row */
    .drag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding: 2px 8px;
      background: rgba(244, 239, 231, .4);
    }

    .drag-handle {
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px;
      opacity: .35;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-handle span {
      display: block;
      width: 18px;
      height: 1.5px;
      background: var(--ink);
      border-radius: 2px;
    }

    .song-row:hover .drag-handle {
      opacity: .65;
    }

    .move-arrows {
      display: flex;
      gap: 3px;
    }

    .btn-mv {
      background: none;
      border: 1px solid var(--border-s);
      border-radius: 4px;
      width: 20px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 0;
      transition: background .12s, color .12s;
    }

    .btn-mv:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .btn-mv:disabled {
      opacity: .2;
      cursor: default;
    }

    .btn-mv svg {
      width: 9px;
      height: 9px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* song edit panel */
    .song-edit {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--soft);
      padding: 9px 11px;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .song-row.editing .song-edit {
      display: flex;
    }

    .se-f {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 100px;
    }

    .se-f label,
    .ug label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .se-f input {
      border: 1px solid var(--border-s);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 5px 8px;
      outline: none;
      width: 100%;
    }

    .se-f input:focus,
    .se-f input:focus {
      border-color: var(--gold);
    }

    .ug {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 110px;
    }

    .file-input {
      border: 1px dashed var(--border-s);
      background: var(--surface);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 10px;
      width: 100%;
    }

    .hint {
      font-size: 9px;
      color: var(--faint);
      margin-top: 1px;
    }

    .hint a {
      color: var(--blue);
      text-decoration: none;
    }

    .hint a:hover {
      text-decoration: underline;
    }

    .save-btn {
      background: var(--ink);
      color: var(--gold-s);
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      align-self: flex-end;
    }

    .save-btn:hover {
      background: var(--ink2);
    }

    /* file previews strip */
    .file-strip {
      display: none;
      grid-column: 1/-1;
      gap: 5px;
      flex-wrap: wrap;
      padding: 6px 11px 8px;
      border-top: 1px solid var(--border);
      background: var(--soft);
    }

    .song-row.editing .file-strip {
      display: flex;
    }

    .file-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border-s);
      border-radius: 6px;
      background: var(--surface);
      padding: 4px 8px;
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .12s;
    }

    .file-chip:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .file-chip.img-chip {
      border-color: rgba(93, 110, 77, .25);
      color: var(--green);
    }

    .file-chip.img-chip:hover {
      border-color: var(--green);
    }

    .chip-del {
      background: none;
      border: none;
      color: var(--faint);
      font-size: 12px;
      padding: 0 2px;
      line-height: 1;
      cursor: pointer;
    }

    .chip-del:hover {
      color: var(--danger);
    }

    .ftype-opt {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      border: 1px solid var(--border-s);
      border-radius: 5px;
      padding: 3px 7px;
      transition: background .12s, border-color .12s, color .12s;
    }

    .ftype-opt:has(input:checked) {
      background: var(--ink);
      color: var(--gold-s);
      border-color: var(--ink);
    }

    .ftype-opt input {
      display: none;
    }

    .chip-del:hover {
      color: var(--danger);
    }

    /* PDF VIEWER */
    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(18, 16, 12, .76);
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .viewer.open {
      display: flex;
    }

    .vbox {
      width: 100%;
      max-width: 840px;
      height: min(92vh, 840px);
      background: var(--surface);
      border: 1px solid rgba(234, 215, 165, .35);
      border-radius: 12px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .vhead {
      background: var(--ink);
      color: #fff;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      border-bottom: 1px solid rgba(234, 215, 165, .35);
      flex-shrink: 0;
    }

    .vhead-info h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    .vhead-info p {
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold-s);
      margin-top: 2px;
    }

    .vok {
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      transition: opacity .12s;
    }

    .vok:hover {
      opacity: .85;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #ebe9e3;
      display: block;
    }

    .img-frame {
      flex: 1;
      width: 100%;
      object-fit: contain;
      display: block;
      background: #ebe9e3;
    }

    .empty-view {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: "Cormorant Garamond", serif;
      font-size: 20px;
      text-align: center;
      padding: 24px;
    }

    /* HISTÓRICO */
    .hist-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .hist-empty {
      color: var(--faint);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      text-align: center;
      padding: 3rem;
      font-style: italic;
    }

    .hist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: border-color .13s, box-shadow .13s;
    }

    .hist-card:hover {
      border-color: rgba(184, 139, 55, .35);
      box-shadow: 0 2px 10px rgba(24, 22, 18, .08);
    }

    .hist-num {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--gold);
      min-width: 34px;
      text-align: center;
      line-height: 1;
    }

    .hist-divider {
      width: 1px;
      height: 34px;
      background: var(--border);
    }

    .hist-body {
      flex: 1;
      min-width: 0;
    }

    .hist-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .hist-del {
      background: none;
      border: 1px solid rgba(155, 53, 37, .22);
      border-radius: 5px;
      padding: 4px 8px;
      color: rgba(155, 53, 37, .55);
      font-size: 10px;
    }

    .hist-del:hover {
      background: #fff0ed;
      color: var(--danger);
    }

    /* CALENDÁRIO */
    .cal-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .cal-head {
      background: var(--ink);
      color: #fff;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-head span {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      font-weight: 600;
    }

    .cal-nav {
      background: none;
      border: 1px solid rgba(234, 215, 165, .23);
      border-radius: 5px;
      color: var(--gold-s);
      padding: 4px 10px;
      font-size: 13px;
    }

    .cal-dow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .cal-dow span {
      text-align: center;
      padding: 6px 2px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      min-height: 56px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px 3px;
      gap: 2px;
      cursor: pointer;
      transition: background .12s, box-shadow .12s;
      position: relative;
    }

    .cal-day:nth-child(7n) {
      border-right: none;
    }

    .cal-day.other-month .cal-day-num {
      color: var(--faint);
    }

    .cal-day.today .cal-day-num {
      color: var(--gold);
      font-weight: 700;
    }

    .cal-day.today:not(.has-event) {
      background: var(--gold-bg);
    }

    .cal-day:hover {
      filter: brightness(.95);
    }

    .cal-day-num {
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      flex-shrink: 0;
    }

    .cal-ev-label {
      display: block;
      font-size: 8px;
      font-weight: 600;
      color: var(--ink2);
      background: rgba(255, 255, 255, .55);
      border-radius: 3px;
      padding: 1px 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
      line-height: 1.4;
    }

    .cal-event-pill {
      font-size: 8px;
      font-weight: 600;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      line-height: 1.3;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(0, 0, 0, .1);
      color: var(--ink);
    }

    /* colored day block — color set via inline style background */
    .cal-day.has-event {
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .08);
    }

    /* EVENT PANEL */
    .event-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 13px;
      display: none;
      margin-top: 12px;
    }

    .event-panel.open {
      display: block;
    }

    .ep-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .ep-existing {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .ep-existing-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .ep-rep-card {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-s);
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--soft);
      cursor: pointer;
      transition: border-color .13s, box-shadow .13s;
    }

    .ep-rep-card:hover {
      border-color: var(--gold);
      box-shadow: 0 2px 8px rgba(184, 139, 55, .15);
    }

    .ep-rep-info {
      flex: 1;
      min-width: 0;
    }

    .ep-rep-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ep-rep-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    .ep-open-btn {
      background: var(--ink);
      color: var(--gold-s);
      border: none;
      border-radius: 5px;
      padding: 5px 11px;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .ep-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--faint);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 10px 0;
    }

    .ep-divider::before,
    .ep-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .ep-row {
      display: flex;
      gap: 7px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .ep-f {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 120px;
    }

    .ep-f label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .ep-f input {
      border: 1px solid var(--border-s);
      border-radius: 6px;
      background: var(--soft);
      color: var(--ink);
      padding: 6px 9px;
      outline: none;
      width: 100%;
      font-size: 13px;
    }

    .ep-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-ep-go {
      background: var(--ink);
      color: var(--gold-s);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-ep-cancel {
      background: none;
      border: 1px solid var(--border-s);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    /* color swatches */
    .ep-color-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .ep-color-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-right: 2px;
    }

    .c-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform .12s, border-color .12s;
      flex-shrink: 0;
    }

    .c-swatch:hover {
      transform: scale(1.18);
    }

    .c-swatch.sel {
      border-color: var(--ink);
      transform: scale(1.22);
    }

    .c-swatch.clear {
      background: var(--soft) !important;
      border: 1.5px dashed var(--border-s);
    }

    /* TOM INLINE EDIT */
    .tom-inline {
      display: none;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .tom-inline.open {
      display: flex;
    }

    .tom-inline input {
      border: 1px solid var(--gold);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      padding: 3px 7px;
      outline: none;
      font-size: 11px;
      width: 70px;
    }

    .tom-inline button {
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink2);
      color: #fff;
      border: 1px solid rgba(234, 215, 165, .25);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 998;
      background: rgba(22, 19, 15, .5);
      align-items: center;
      justify-content: center;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(234, 215, 165, .2);
      border-top-color: var(--gold-s);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:600px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-btn-wide {
        grid-column: auto;
      }

      .song-top {
        grid-template-columns: 46px 1fr auto;
      }

      .song-title {
        white-space: normal;
        font-size: 12px;
      }

      .num-val {
        font-size: 15px;
      }

      .cal-day {
        min-height: 36px;
      }

      .cal-day-num {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- HOME -->
  <div class="screen active" id="home">
    <div class="staff-bg-svg" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 800 600"
        style="width:100%;height:100%;position:absolute;top:0;left:0;pointer-events:none;">

        <ellipse cx="175" cy="213" rx="7" ry="5" fill="#e8e8e8" transform="rotate(-15 175 213)" />
        <line x1="182" y1="210" x2="182" y2="180" stroke="#e8e8e8" stroke-width="1.5" />

        <ellipse cx="580" cy="219" rx="7" ry="5" fill="#e8e8e8" transform="rotate(-15 580 219)" />

        <line x1="550" y1="198" x2="550" y2="246" stroke="#e8e8e8" stroke-width="1" />
        <line x1="740" y1="198" x2="740" y2="246" stroke="#e8e8e8" stroke-width="1" />
      </svg>
    </div>
    <div class="home-inner">
      <p class="home-kicker">Roteiro Litúrgico Musical</p>
      <h1 class="home-title">Roteiro<br><em>Litúrgico</em></h1>
      <p class="home-date" id="homeDate"></p>
      <div class="home-rule"></div>
      <div class="menu-grid">
        <button class="menu-btn card-novo" onclick="goNewRepertorio()">
          <div class="mc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg></div>
          <div class="mc-label">Novo Repertório</div>
          <div class="mc-desc">Criar lista para uma celebração</div>
        </button>
        <button class="menu-btn card-rep" onclick="goHistorico()">
          <div class="mc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg></div>
          <div class="mc-label">Repertórios</div>
          <div class="mc-desc">Histórico de listas salvas</div>
        </button>
        <button class="menu-btn card-ev menu-btn-wide" onclick="goScreen('eventos')">
          <div class="mc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg></div>
          <div>
            <div class="mc-label">Eventos</div>
            <div class="mc-desc">Calendário — clique em uma data para criar ou abrir um repertório</div>
          </div>
        </button>
      </div>
      <div class="menu-util">
        <button class="util-card" onclick="exportBackup()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />

            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span class="util-label">Exportar</span>
        </button>
        <button class="util-card" onclick="importBackup()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />

          <span class="util-label">Importar</span>

    </div>
  </div>
  <!-- REPERTÓRIO -->
  <div class="screen" id="repertorio">
    <header>
      <div class="subpage-header">
        <button class="back-btn" onclick="goHome()">
          <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6" />
          </svg> Menu
        </button>
        <div class="subpage-title-block">
          <div class="subpage-kicker">Roteiro Litúrgico Musical</div>
          <div class="subpage-h1" id="repTitle">Novo Repertório<span id="repDate" class="subpage-sub"></span><input

  <script>
    /* ═══════════════ SUPABASE ═══════════════ */
    const SB_URL = "https://bmwsajjaqockpfzckude.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtd3NhamphcW9ja3BmemNrdWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTYzNjUsImV4cCI6MjA5NTkzMjM2NX0.ZE7YiPCm5ybvYwPYD63MgLsHze-2t0oq5sdvtQqBc98";
    const BUCKET = "pdfs-repertorio";

    async function sbFetch(path, opts = {}) {
      const res = await fetch(SB_URL + path, {
        headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json", "Prefer": "return=representation", ...(opts.headers || {}) },
        ...opts
      });
      if (!res.ok) { const e = await res.text(); throw new Error(e); }
      const txt = await res.text();
      return txt ? JSON.parse(txt) : [];
    }

    /* upload file to Supabase Storage, return public URL */
    async function sbUpload(path, file) {
      const res = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "POST",
        headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": file.type, "x-upsert": "true" },
        body: file
      });
      if (!res.ok) { const e = await res.text(); throw new Error(e); }
      return `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    }

    async function sbDeleteFile(path) {
      await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "DELETE",
        headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
      });
    }

    /* ═══════════════ STATE ═══════════════ */
    const MOMENTOS_DEFAULT = ["Invocação", "Acolhida", "Entrada", "Ato Penitencial", "Glória", "Bíblia / Entrada", "Aclamação", "Ladainha", "Ofertório", "Santo", "Cordeiro", "Comunhão I", "Comunhão II / Ação de Graças", "Final"];
    function makeFreshSongs() { return MOMENTOS_DEFAULT.map((m, i) => ({ id: i + 1, momento: m, titulo: "", tom: "", vocais: "", cor: "", files: [] })); }

    let history = [];
    let curSongs = [];
    let curDone = {};
    let curRepId = null;
    let curOpenEd = null;
    let curNextId = 15;
    let autoSaveTimer = null;
    let dragSrcIdx = null;

    const MONTHS_PT = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const now = new Date();
    let calYear = now.getFullYear(), calMonth = now.getMonth(), selectedCalDate = null;

    const _ds = now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    document.getElementById("homeDate").textContent = _ds.charAt(0).toUpperCase() + _ds.slice(1);

    /* ═══════════════ UI HELPERS ═══════════════ */
    let toastTimer = null;
    function showToast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.borderColor = type === "err" ? "var(--danger)" : type === "auto" ? "var(--green)" : "var(--gold)";
      t.classList.add("show"); clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
    }
    function showLoading(v) { document.getElementById("loading").classList.toggle("show", v); }

    /* ═══════════════ SCREENS ═══════════════ */
    function goScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active"); window.scrollTo(0, 0);
      if (id === "eventos") renderCal();
    }
    function goHome() { goScreen("home"); }
    async function goHistorico() { goScreen("historico"); await loadHistory(); }

    function goNewRepertorio() {
      curRepId = null; curSongs = makeFreshSongs(); curDone = {}; curOpenEd = null; curNextId = 15; curCor = "";
      setRepHeader("Novo Repertório", "", "");
      document.getElementById("celebLabel").textContent = "Celebração";
      document.getElementById("hep").classList.remove("open");
      goScreen("repertorio"); render();
    }

    async function openRepertorio(id) {
      showLoading(true);
      try {
        const rows = await sbFetch(`/rest/v1/repertorios?id=eq.${id}&select=*`);
        if (!rows.length) throw new Error("não encontrado");
        const rep = rows[0];
        curRepId = rep.id;
        curSongs = (rep.songs || makeFreshSongs()).map(s => ({ files: [], vocais: "", cor: "", ...s }));
        curCor = rep.cor || "";
        curDone = rep.done || {}; curOpenEd = null;
        curNextId = Math.max(...curSongs.map(s => s.id), 14) + 1;
        setRepHeader(rep.titulo || "Repertório", rep.data_iso || displayToIso(rep.data_evento || ""), rep.data_evento || "");
        document.getElementById("celebLabel").textContent = rep.celebracao || "Celebração";
        document.getElementById("hep").classList.remove("open");
        goScreen("repertorio"); render();
      } catch (e) { showToast("Erro ao carregar: " + e.message, "err"); }
      finally { showLoading(false); }
    }

    /* ═══════════════ HEADER ═══════════════ */
    /* date helpers:
       repDate (visible span) = "14 de junho de 2026"
       repDateIso (hidden input) = "2026-06-14"
       The calendar uses fmtDate() which produces "14 de junho de 2026"
       so we always keep both in sync. */
    function isoToDisplay(iso) {
      if (!iso) return "";
      try {
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(y, m - 1, d).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
      } catch (e) { return iso; }
    }
    function displayToIso(display) {
      if (!display) return "";
      /* already ISO */
      if (/^\d{4}-\d{2}-\d{2}$/.test(display.trim())) return display.trim();
      /* try to parse "14 de junho de 2026" or "14/06/2026" */
      try {
        const parts = display.match(/(\d{1,2})[\s\/de]+(\w+)[\s\/de]+(\d{4})/i);
        if (parts) {
          const months = { "janeiro": 1, "fevereiro": 2, "março": 3, "abril": 4, "maio": 5, "junho": 6, "julho": 7, "agosto": 8, "setembro": 9, "outubro": 10, "novembro": 11, "dezembro": 12 };
          const m = months[parts[2].toLowerCase()];
          if (m) return `${parts[3]}-${String(m).padStart(2, "0")}-${String(parts[1]).padStart(2, "0")}`;
        }
        /* try numeric dd/mm/yyyy */
        const num = display.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (num) return `${num[3]}-${num[2].padStart(2, "0")}-${num[1].padStart(2, "0")}`;
      } catch (e) { }
      return "";
    }
    function setRepHeader(title, isoDate, displayDate) {
      document.getElementById("repTitle").childNodes[0].textContent = title;
      /* isoDate: "2026-06-14"  displayDate: "14 de junho de 2026" */
      const iso = isoDate || "";
      const display = displayDate || (iso ? isoToDisplay(iso) : "");
      document.getElementById("repDate").textContent = display;
      document.getElementById("repDateIso").value = iso;
    }
    function toggleHep() {
      const p = document.getElementById("hep"); p.classList.toggle("open");
      if (p.classList.contains("open")) {
        document.getElementById("hfTitle").value = document.getElementById("repTitle").childNodes[0].textContent.trim();
        document.getElementById("hfDate").value = document.getElementById("repDateIso").value || "";
        /* restore color selection */
        document.querySelectorAll(".hc-swatch").forEach(s => s.classList.remove("hc-sel"));
        const matching = document.querySelector(`.hc-swatch[data-cor="${curCor || ''}"]`);
        if (matching) matching.classList.add("hc-sel");
        else document.querySelector(".hc-clear")?.classList.add("hc-sel");
      }
    }
    function selectHepColor(el, cor) {
      document.querySelectorAll(".hc-swatch").forEach(s => s.classList.remove("hc-sel"));
      el.classList.add("hc-sel");
      curCor = cor;
    }
    function saveHeaderInfo() {
      const title = document.getElementById("hfTitle").value.trim() || "Repertório";
      const iso = document.getElementById("hfDate").value;
      setRepHeader(title, iso);
      document.getElementById("hep").classList.remove("open"); scheduleAutoSave();
    }
    function toggleCelebEdit() {
      const w = document.getElementById("celebEditWrap");
      if (w.classList.toggle("open")) document.getElementById("celebInput").value = document.getElementById("celebLabel").textContent.trim();
    }
    function saveCeleb() {
      const v = document.getElementById("celebInput").value.trim();
      if (v) document.getElementById("celebLabel").textContent = v;
      document.getElementById("celebEditWrap").classList.remove("open"); scheduleAutoSave();
    }

    /* ═══════════════ SUPABASE SAVE ═══════════════ */
    let curCor = ""; /* current repertório calendar color */

    function buildPayload() {
      /* strip File objects before saving to JSON */
      const songs = curSongs.map(s => ({ ...s, files: (s.files || []).map(f => ({ name: f.name, url: f.url, type: f.type })) }));
      const iso = document.getElementById("repDateIso").value || "";
      const display = iso ? isoToDisplay(iso) : (document.getElementById("repDate").textContent.trim() || "");
      return {
        titulo: document.getElementById("repTitle").childNodes[0].textContent.trim() || "Repertório",
        data_evento: display,
        data_iso: iso,
        celebracao: document.getElementById("celebLabel").textContent.trim(),
        cor: curCor || null,
        songs, done: curDone, atualizado_em: new Date().toISOString()
      };
    }
    async function saveRepertorio() {
      showLoading(true);
      try {
        const payload = buildPayload();
        if (curRepId) {
          await sbFetch(`/rest/v1/repertorios?id=eq.${curRepId}`, { method: "PATCH", body: JSON.stringify(payload) });
        } else {
          const rows = await sbFetch("/rest/v1/repertorios", { method: "POST", body: JSON.stringify(payload) });
          if (rows && rows[0]) curRepId = rows[0].id;
        }
        showToast(`✓ "${payload.titulo}" salvo!`, "ok");
      } catch (e) { showToast("Erro ao salvar: " + e.message, "err"); }
      finally { showLoading(false); }
    }
    function scheduleAutoSave() {
      if (!curSongs.some(s => s.titulo)) return;
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(async () => {
        try {
          const payload = buildPayload();
          if (curRepId) {
            await sbFetch(`/rest/v1/repertorios?id=eq.${curRepId}`, { method: "PATCH", body: JSON.stringify(payload) });
            showToast("💾 Salvo automaticamente", "auto");
          } else {
            const rows = await sbFetch("/rest/v1/repertorios", { method: "POST", body: JSON.stringify(payload) });
            if (rows && rows[0]) curRepId = rows[0].id;
            showToast("💾 Salvo automaticamente", "auto");
          }
        } catch (e) { }
      }, 2000);
    }
    async function loadHistory() {
      showLoading(true);
      try {
        history = await sbFetch("/rest/v1/repertorios?select=id,titulo,data_evento,celebracao,atualizado_em&order=atualizado_em.desc");
        renderHist();
      } catch (e) { showToast("Erro ao carregar histórico", "err"); }
      finally { showLoading(false); }
    }

    /* ═══════════════ RENDER SONGS ═══════════════ */
    function pad(n) { return String(n).padStart(2, "0"); }

    function render() {
      const list = document.getElementById("songList"); list.innerHTML = "";
      curSongs.forEach((song, idx) => {
        const isDone = !!curDone[song.id];
        const row = document.createElement("article");
        const rowColor = song.cor || "";
        row.className = "song-row" + (curOpenEd === song.id ? " editing" : "") + (isDone ? " done" : "") + (rowColor ? " row-color" : "");
        if (rowColor) {
          row.style.setProperty("--row-bg", rowColor + "22");
          row.style.setProperty("--row-border", rowColor + "88");
          row.style.setProperty("--row-text", rowColor);
          row.style.borderLeft = `3px solid ${rowColor}`;
        } else {
          row.style.removeProperty("--row-bg");
          row.style.removeProperty("--row-border");
          row.style.removeProperty("--row-text");
          row.style.borderLeft = "";
        }
        row.draggable = true;
        row.dataset.idx = idx;

        const files = song.files || [];
        const tagLabel = { letra: 'Letra', cifra: 'Cifra', geral: '', image: 'Foto' };
        const tagColor = { letra: 'color:var(--green)', cifra: 'color:var(--blue)', geral: 'color:var(--muted)', image: 'color:var(--green)' };
        const chipsHtml = files.map((f, fi) => {
          const tag = f.fileTag || f.type || '';
          const icon = f.type === 'image' ? '🖼' : '📄';
          const lbl = tagLabel[tag] || '';
          const clr = tagColor[tag] || '';
          return `<div class="file-chip ${f.type === 'image' ? 'img-chip' : ''}" data-sid="${song.id}" data-fi="${fi}">
        ${icon} ${esc(f.name)}${lbl ? ` <span style="font-size:9px;font-weight:700;${clr};margin-left:2px;">[${lbl}]</span>` : ''}
        <button class="chip-del" data-sid="${song.id}" data-fi="${fi}">×</button>
      </div>`;
        }).join("");

        const tomLabel = song.tom ? `Tom: ${esc(song.tom)}` : "Tom: —";
        row.innerHTML = `
      <div class="song-top">
        <div class="num-block" onclick="toggleDone(${song.id})" title="Marcar como tocada">
          <div class="chk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="num-val">${pad(idx + 1)}</div>
        </div>
        <div class="song-main">
          <div class="song-top-row">
            <span class="pill">${esc(song.momento)}</span>
            <span class="tom-badge ${song.tom ? '' : 'empty'}" onclick="toggleTomEdit(${song.id},event)">${tomLabel}</span>
          </div>
          <div class="tom-inline" id="tom-inline-${song.id}">
            <input id="tom-input-${song.id}" placeholder="Ex: G, Am, F" value="${escA(song.tom || '')}"/>
            <button onclick="saveTom(${song.id})">OK</button>
          </div>
          <div class="song-title ${song.titulo ? '' : 'empty'}">${esc(song.titulo || 'nome da música')}</div>
          ${song.vocais ? `<div class="vocal-line"><strong>Vocais:</strong> ${esc(song.vocais)}</div>` : ''}
        </div>
        <div class="song-tools">
          <div class="tools-row">
            <button class="btn-letra" onclick="openFileByType(${song.id},'letra')">Letra</button>
            <button class="btn-cifra" onclick="openFileByType(${song.id},'cifra')">Cifra</button>
          </div>
          <div class="tools-row">
            <button class="btn-edit" onclick="toggleEdit(${song.id})">Editar</button>
            <button class="btn-clear" onclick="clearSong(${song.id})">Limpar</button>
          </div>
        </div>
      </div>
      <div class="drag-row">
        <div class="drag-handle" title="Arrastar para reordenar"><span></span><span></span><span></span></div>
        <div class="move-arrows">
          <button class="btn-mv" onclick="moveUp(${idx})" ${idx === 0 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <button class="btn-mv" onclick="moveDown(${idx})" ${idx === curSongs.length - 1 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>
      <div class="song-edit">
        <div class="se-f"><label>Momento</label><input id="m-${song.id}" value="${escA(song.momento)}"></div>
        <div class="se-f"><label>Nome da música</label><input id="t-${song.id}" value="${escA(song.titulo)}" placeholder="Nome da música"></div>
        <div class="se-f"><label>Tom</label><input id="tom-edit-${song.id}" value="${escA(song.tom || '')}" placeholder="Ex: G, Am, F#"></div>
        <div class="se-f" style="min-width:200px;flex:2;"><label>Vocais</label><input id="voc-${song.id}" value="${escA(song.vocais || '')}" placeholder="Ex: Ana, Pedro, Maria"></div>
        <div class="se-f" style="min-width:180px;">
          <label>Cor da linha</label>
          <div class="row-color-picker">
            <div class="rcp-swatch rcp-clear ${!song.cor ? 'rcp-sel' : ''}" data-id="${song.id}" data-cor="" onclick="pickRowColor(this,${song.id},'')"></div>
            <div class="rcp-swatch ${song.cor === "#e05252" ? 'rcp-sel' : ''}" style="background:#e05252;" data-id="${song.id}" data-cor="#e05252" onclick="pickRowColor(this,${song.id},'#e05252')"></div>
            <div class="rcp-swatch ${song.cor === "#e07c32" ? 'rcp-sel' : ''}" style="background:#e07c32;" data-id="${song.id}" data-cor="#e07c32" onclick="pickRowColor(this,${song.id},'#e07c32')"></div>
            <div class="rcp-swatch ${song.cor === "#c9a020" ? 'rcp-sel' : ''}" style="background:#c9a020;" data-id="${song.id}" data-cor="#c9a020" onclick="pickRowColor(this,${song.id},'#c9a020')"></div>
            <div class="rcp-swatch ${song.cor === "#4a9e60" ? 'rcp-sel' : ''}" style="background:#4a9e60;" data-id="${song.id}" data-cor="#4a9e60" onclick="pickRowColor(this,${song.id},'#4a9e60')"></div>
            <div class="rcp-swatch ${song.cor === "#2a6baa" ? 'rcp-sel' : ''}" style="background:#2a6baa;" data-id="${song.id}" data-cor="#2a6baa" onclick="pickRowColor(this,${song.id},'#2a6baa')"></div>
            <div class="rcp-swatch ${song.cor === "#7a4aaa" ? 'rcp-sel' : ''}" style="background:#7a4aaa;" data-id="${song.id}" data-cor="#7a4aaa" onclick="pickRowColor(this,${song.id},'#7a4aaa')"></div>
            <div class="rcp-swatch ${song.cor === "#c04a80" ? 'rcp-sel' : ''}" style="background:#c04a80;" data-id="${song.id}" data-cor="#c04a80" onclick="pickRowColor(this,${song.id},'#c04a80')"></div>
            <div class="rcp-swatch ${song.cor === "#3a9eaa" ? 'rcp-sel' : ''}" style="background:#3a9eaa;" data-id="${song.id}" data-cor="#3a9eaa" onclick="pickRowColor(this,${song.id},'#3a9eaa')"></div>
          </div>
        </div>
        <div class="ug" style="min-width:100%;">
          <label>Adicionar arquivo</label>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px;">
            <span style="font-size:10px;color:var(--muted);">Tipo:</span>
            <label class="ftype-opt"><input type="radio" name="ftype-${song.id}" value="letra" checked> <span>Letra</span></label>
            <label class="ftype-opt"><input type="radio" name="ftype-${song.id}" value="cifra"> <span>Cifra</span></label>
            <label class="ftype-opt"><input type="radio" name="ftype-${song.id}" value="geral"> <span>Geral</span></label>
          </div>
          <input class="file-input" type="file" accept="application/pdf,image/*" multiple data-songid="${song.id}" onchange="handleFileInput(this)">
          <span class="hint">PDF ou imagem — marque o tipo antes de escolher o arquivo</span>
        </div>
        <button class="save-btn" onclick="saveSong(${song.id})">Salvar</button>
      </div>
      <div class="file-strip">${chipsHtml}</div>
    `;

        /* drag events */
        row.addEventListener("dragstart", e => { dragSrcIdx = idx; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
        row.addEventListener("dragend", () => { row.classList.remove("dragging"); document.querySelectorAll(".song-row").forEach(r => r.classList.remove("drag-over")); });
        row.addEventListener("dragover", e => { e.preventDefault(); document.querySelectorAll(".song-row").forEach(r => r.classList.remove("drag-over")); row.classList.add("drag-over"); });
        row.addEventListener("drop", e => {
          e.preventDefault();
          if (dragSrcIdx === null || dragSrcIdx === idx) return;
          const moved = curSongs.splice(dragSrcIdx, 1)[0]; curSongs.splice(idx, 0, moved); dragSrcIdx = null; render(); scheduleAutoSave();
        });

        list.appendChild(row);
      });
    }

    /* ═══════════════ SONG ACTIONS ═══════════════ */
    function toggleDone(id) { curDone[id] = !curDone[id]; render(); scheduleAutoSave(); }

    function moveUp(idx) { if (idx === 0) return;[curSongs[idx - 1], curSongs[idx]] = [curSongs[idx], curSongs[idx - 1]]; render(); scheduleAutoSave(); }
    function moveDown(idx) { if (idx >= curSongs.length - 1) return;[curSongs[idx], curSongs[idx + 1]] = [curSongs[idx + 1], curSongs[idx]]; render(); scheduleAutoSave(); }

    function addSong() {
      curSongs.push({ id: curNextId++, momento: "Novo momento", titulo: "", tom: "", files: [] });
      curOpenEd = curSongs[curSongs.length - 1].id; render();
      document.querySelector(".song-row.editing")?.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function toggleEdit(id) { curOpenEd = curOpenEd === id ? null : id; render(); }

    function saveSong(id) {
      const s = curSongs.find(x => x.id === id); if (!s) return;
      s.momento = document.getElementById(`m-${id}`).value.trim() || s.momento;
      s.titulo = document.getElementById(`t-${id}`).value.trim();
      s.tom = document.getElementById(`tom-edit-${id}`).value.trim();
      s.vocais = document.getElementById(`voc-${id}`)?.value.trim() || "";
      curOpenEd = null; render(); scheduleAutoSave();
    }

    function pickRowColor(el, id, cor) {
      const s = curSongs.find(x => x.id === id); if (!s) return;
      s.cor = cor;
      /* update swatches visually without full re-render */
      el.closest(".row-color-picker").querySelectorAll(".rcp-swatch").forEach(sw => sw.classList.remove("rcp-sel"));
      el.classList.add("rcp-sel");
      render(); scheduleAutoSave();
    }

    function clearSong(id) {
      if (!confirm("Limpar nome, tom e arquivos desta música?")) return;
      const s = curSongs.find(x => x.id === id);
      if (s) { s.titulo = ""; s.tom = ""; s.vocais = ""; s.cor = ""; s.files = []; }
      delete curDone[id];
      render(); scheduleAutoSave();
    }

    /* ═══════════════ TOM INLINE ═══════════════ */
    function toggleTomEdit(id, e) {
      e.stopPropagation();
      const wrap = document.getElementById(`tom-inline-${id}`);
      wrap.classList.toggle("open");
      if (wrap.classList.contains("open")) document.getElementById(`tom-input-${id}`).focus();
    }
    function saveTom(id) {
      const s = curSongs.find(x => x.id === id); if (!s) return;
      s.tom = document.getElementById(`tom-input-${id}`).value.trim();
      render(); scheduleAutoSave();
    }

    /* ═══════════════ FILE ATTACH (Supabase Storage) ═══════════════ */
    async function ensureRepId() {
      if (curRepId) return true;
      try {
        const payload = buildPayload();
        const rows = await sbFetch("/rest/v1/repertorios", { method: "POST", body: JSON.stringify(payload) });
        if (rows && rows[0]) { curRepId = rows[0].id; return true; }
      } catch (e) { showToast("Erro ao criar repertório: " + e.message, "err"); }
      return false;
    }

    function handleFileInput(input) {
      const songId = parseInt(input.dataset.songid);
      const checked = input.closest(".song-edit").querySelector(`input[name="ftype-${songId}"]:checked`);
      const fileTag = checked ? checked.value : "geral";
      attachFiles(songId, input.files, fileTag);
    }

    async function attachFiles(id, fileList, fileTag = "geral") {
      if (!fileList || !fileList.length) return;
      const s = curSongs.find(x => x.id === id); if (!s) return;
      showLoading(true);
      try {
        const ok = await ensureRepId();
        if (!ok) { showLoading(false); return; }
        for (const file of Array.from(fileList)) {
          const isImg = file.type.startsWith("image/");
          const ext = file.name.split(".").pop();
          const safeName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
          const storagePath = `rep-${curRepId}/${id}/${safeName}`;
          let url;
          try {
            url = await sbUpload(storagePath, file);
          } catch (uploadErr) {
            showToast("⚠ Erro no upload: " + uploadErr.message, "err");
            continue;
          }
          if (!s.files) s.files = [];
          s.files.push({ name: file.name, url, storagePath, type: isImg ? "image" : "pdf", fileTag: isImg ? "image" : fileTag });
        }
        render(); scheduleAutoSave();
        showToast("✓ Arquivo(s) adicionado(s)", "ok");
      } catch (e) { showToast("Erro ao anexar: " + e.message, "err"); }
      finally { showLoading(false); }
    }

    async function delFile(e, id, fi) {
      e.stopPropagation();
      if (!confirm("Remover este arquivo?")) return;
      const s = curSongs.find(x => x.id === id); if (!s || !s.files) return;
      const f = s.files[fi];
      if (f && f.storagePath) { try { await sbDeleteFile(f.storagePath); } catch (err) { } }
      s.files.splice(fi, 1); render(); scheduleAutoSave();
    }

    function openFileByType(id, type) {
      const s = curSongs.find(x => x.id === id); if (!s) return;
      /* match by fileTag first, then fallback to filename */
      let files = (s.files || []).filter(f => f.fileTag === type);
      if (!files.length) files = (s.files || []).filter(f => f.name.toLowerCase().includes(type));
      /* if still empty and there's only 1 file total, open it */
      if (!files.length && (s.files || []).length === 1) files = s.files;
      if (!files.length) { openViewerEmpty(s.titulo || s.momento, type); return; }
      openViewerFile(s.titulo || s.momento, s.momento + " · " + (type === "letra" ? "Letra" : "Cifra"), files[0]);
    }
    function openFile(id, fi) {
      const s = curSongs.find(x => x.id === id); if (!s) return;
      const f = (s.files || [])[fi]; if (!f) return;
      openViewerFile(s.titulo || s.momento, f.name, f);
    }
    function openViewerFile(title, meta, f) {
      document.getElementById("vTitle").textContent = title;
      document.getElementById("vMeta").textContent = meta;
      const pf = document.getElementById("pdfFrame");
      const imgf = document.getElementById("imgFrame");
      const empty = document.getElementById("emptyView");
      document.getElementById("viewer").classList.add("open");
      if (f.type === "image") {
        pf.style.display = "none"; imgf.style.display = "block"; empty.style.display = "none";
        imgf.src = f.url;
      } else {
        imgf.style.display = "none"; pf.style.display = "block"; empty.style.display = "none";
        pf.src = f.url;
      }
    }
    function openViewerEmpty(title, type) {
      document.getElementById("vTitle").textContent = title;
      document.getElementById("vMeta").textContent = type;
      document.getElementById("pdfFrame").style.display = "none";
      document.getElementById("imgFrame").style.display = "none";
      document.getElementById("emptyView").style.display = "grid";
      document.getElementById("viewer").classList.add("open");
    }
    function closeViewer() {
      document.getElementById("viewer").classList.remove("open");
      document.getElementById("pdfFrame").removeAttribute("src");
      document.getElementById("imgFrame").removeAttribute("src");
    }

    /* ═══════════════ HISTÓRICO ═══════════════ */
    function renderHist() {
      const el = document.getElementById("histList"); el.innerHTML = "";
      if (!history.length) { el.innerHTML = '<p class="hist-empty">Nenhum repertório salvo ainda.</p>'; return; }
      history.forEach((rep, i) => {
        const card = document.createElement("div"); card.className = "hist-card";
        const d = rep.atualizado_em ? new Date(rep.atualizado_em).toLocaleDateString("pt-BR") : "";
        card.innerHTML = `
      <div class="hist-num">${pad(i + 1)}</div>
      <div class="hist-divider"></div>
      <div class="hist-body">
        <div class="hist-title">${esc(rep.titulo || "Repertório")}</div>
        <div class="hist-meta">${esc(rep.data_evento || "")}${rep.data_evento && d ? " · " : ""}${d ? "Salvo " + d : ""}</div>
      </div>
      <button class="hist-del" onclick="delHist(${rep.id},event)">Excluir</button>`;
        card.addEventListener("click", () => openRepertorio(rep.id));
        el.appendChild(card);
      });
    }
    async function delHist(id, e) {
      e.stopPropagation();
      if (!confirm("Excluir este repertório?")) return;
      showLoading(true);
      try {
        await sbFetch(`/rest/v1/repertorios?id=eq.${id}`, { method: "DELETE" });
        history = history.filter(r => r.id !== id); renderHist();
        showToast("Repertório excluído", "ok");
      } catch (err) { showToast("Erro ao excluir", "err"); }
      finally { showLoading(false); }
    }

    /* ═══════════════ CALENDÁRIO ═══════════════ */
    function fmtDate(d) { return d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" }); }
    function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); }
    function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); }

    let calEvMap = {};
    let selectedCor = "";

    async function renderCal() {
      document.getElementById("calMonthLabel").textContent = `${MONTHS_PT[calMonth]} ${calYear}`;
      calEvMap = {};
      try {
        const rows = await sbFetch("/rest/v1/repertorios?select=id,titulo,celebracao,data_evento,data_iso,cor&order=atualizado_em.desc");
        rows.forEach(r => {
          /* index by display string (primary) */
          if (r.data_evento) {
            const k = r.data_evento.trim();
            if (!calEvMap[k]) calEvMap[k] = [];
            calEvMap[k].push(r);
          }
          /* also index by ISO so reps saved via header date-picker are found */
          if (r.data_iso) {
            const disp = isoToDisplay(r.data_iso);
            if (disp && disp !== r.data_evento) {
              if (!calEvMap[disp]) calEvMap[disp] = [];
              /* avoid duplicate */
              if (!calEvMap[disp].find(x => x.id === r.id)) calEvMap[disp].push(r);
            }
          }
        });
      } catch (e) { }

      const grid = document.getElementById("calGrid"); grid.innerHTML = "";
      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const daysInPrev = new Date(calYear, calMonth, 0).getDate();
      const todayStr = fmtDate(now);
      let cells = [];
      for (let i = firstDay - 1; i >= 0; i--)cells.push({ day: daysInPrev - i, cur: false, d: new Date(calYear, calMonth - 1, daysInPrev - i) });
      for (let d = 1; d <= daysInMonth; d++)cells.push({ day: d, cur: true, d: new Date(calYear, calMonth, d) });
      while (cells.length < 42) cells.push({ day: cells.length - firstDay - daysInMonth + 1, cur: false, d: new Date(calYear, calMonth + 1, cells.length - firstDay - daysInMonth + 1) });

      cells.forEach(c => {
        const label = fmtDate(c.d);
        const reps = calEvMap[label] || [];
        const hasEv = reps.length > 0;
        const cor = hasEv && reps[0].cor ? reps[0].cor : "";
        const div = document.createElement("div");
        div.className = "cal-day" + (c.cur ? "" : (" other-month")) + (label === todayStr ? " today" : "") + (hasEv ? " has-event" : "");
        if (cor) { div.style.background = cor; div.style.borderColor = cor; }
        const evLabels = reps.slice(0, 2).map(r =>
          `<span class="cal-ev-label">${esc(r.titulo || r.celebracao || "Rep.")}</span>`
        ).join("");
        div.innerHTML = `<span class="cal-day-num">${c.day}</span>${evLabels}`;
        div.addEventListener("click", () => onCalDayClick(c.d, reps));
        grid.appendChild(div);
      });
    }

    function onCalDayClick(date, reps) {
      selectedCalDate = date;
      if (!reps) { const k = fmtDate(date); reps = calEvMap[k] || []; }

      document.getElementById("eventPanelTitle").textContent = fmtDate(date);
      document.getElementById("epName").value = "";

      selectedCor = "";
      document.querySelectorAll(".c-swatch").forEach(s => s.classList.remove("sel"));
      const clearSwatch = document.querySelector(".c-swatch[data-color='']");
      if (clearSwatch) clearSwatch.classList.add("sel");

      const existWrap = document.getElementById("epExisting");
      const existList = document.getElementById("epExistingList");
      const divider = document.getElementById("epDivider");
      existList.innerHTML = "";
      if (reps.length > 0) {
        existWrap.style.display = "block";
        divider.style.display = "flex";
        reps.forEach(r => {
          const card = document.createElement("div");
          card.className = "ep-rep-card";
          card.innerHTML = `
        <div style="width:11px;height:11px;border-radius:50%;flex-shrink:0;background:${r.cor || 'var(--gold)'};border:1px solid rgba(0,0,0,.12);"></div>
        <div class="ep-rep-info">
          <div class="ep-rep-name">${esc(r.titulo || "Repertório")}</div>
          <div class="ep-rep-meta">${esc(r.celebracao || "")}</div>
        </div>
        <button class="ep-open-btn" onclick="openRepertorio(${r.id})">Abrir →</button>`;
          existList.appendChild(card);
        });
      } else {
        existWrap.style.display = "none";
        divider.style.display = "none";
      }

      const panel = document.getElementById("eventPanel");
      panel.classList.add("open");
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closeEventPanel() { document.getElementById("eventPanel").classList.remove("open"); selectedCalDate = null; }

    function selectColor(el, cor) {
      document.querySelectorAll(".c-swatch").forEach(s => s.classList.remove("sel"));
      el.classList.add("sel"); selectedCor = cor;
    }

    async function goFromEvent() {
      const name = document.getElementById("epName").value.trim();
      const dateStr = selectedCalDate ? fmtDate(selectedCalDate) : "";
      curRepId = null; curSongs = makeFreshSongs(); curDone = {}; curOpenEd = null; curNextId = 15;
      setRepHeader(name || "Repertório", selectedCalDate ? selectedCalDate.toISOString().slice(0, 10) : "", dateStr);
      document.getElementById("celebLabel").textContent = "Celebração";
      document.getElementById("hep").classList.remove("open");
      closeEventPanel();
      try {
        const payload = { titulo: name || "Repertório", data_evento: dateStr, data_iso: selectedCalDate ? selectedCalDate.toISOString().slice(0, 10) : "", celebracao: "Celebração", songs: curSongs, done: {}, cor: selectedCor || null };
        const rows = await sbFetch("/rest/v1/repertorios", { method: "POST", body: JSON.stringify(payload) });
        if (rows && rows[0]) curRepId = rows[0].id;
      } catch (e) { }
      goScreen("repertorio"); render();
    }
    /* ═══════════════ EXPORT / IMPORT ═══════════════ */
    async function exportBackup() {
      showLoading(true);
      try {
        const rows = await sbFetch("/rest/v1/repertorios?select=*&order=atualizado_em.desc");
        const blob = new Blob([JSON.stringify({ version: 4, exportedAt: new Date().toISOString(), repertorios: rows })], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const d = new Date();
        a.href = url; a.download = `roteiro-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
        a.click(); URL.revokeObjectURL(url);
        showToast("✓ Backup exportado!", "ok");
      } catch (e) { showToast("Erro ao exportar", "err"); }
      finally { showLoading(false); }
    }
    function importBackup() {
      const input = document.createElement("input"); input.type = "file"; input.accept = "application/json";
      input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        showLoading(true);
        try {
          const backup = JSON.parse(await file.text());
          const list = backup.repertorios || [];
          if (!list.length) throw new Error("Arquivo sem repertórios");
          if (!confirm(`Importar ${list.length} repertório(s)?`)) { showLoading(false); return; }
          let added = 0;
          for (const rep of list) {
            try {
              const payload = { titulo: rep.titulo || "Repertório", data_evento: rep.data_evento || "", celebracao: rep.celebracao || "Celebração", songs: rep.songs || [], done: rep.done || {} };
              await sbFetch("/rest/v1/repertorios", { method: "POST", body: JSON.stringify(payload), headers: { "Prefer": "return=minimal" } });
              added++;
            } catch (err) { }
          }
          showToast(`✓ ${added} repertório(s) importado(s)!`, "ok");
        } catch (err) { showToast("Arquivo inválido", "err"); }
        finally { showLoading(false); }
      };
      input.click();
    }

    /* ═══════════════ UTILS ═══════════════ */
    function esc(v) { return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function escA(v) { return esc(v).replace(/"/g, "&quot;"); }

    document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

    /* Event delegation for file chips — avoids inline onclick with filename quotes */
    document.getElementById("songList").addEventListener("click", e => {
      /* chip open */
      const chip = e.target.closest(".file-chip");
      if (chip && !e.target.classList.contains("chip-del")) {
        const sid = parseInt(chip.dataset.sid);
        const fi = parseInt(chip.dataset.fi);
        openFile(sid, fi);
        return;
      }
      /* chip delete */
      const del = e.target.closest(".chip-del");
      if (del) {
        const sid = parseInt(del.dataset.sid);
        const fi = parseInt(del.dataset.fi);
        delFile(e, sid, fi);
        return;
      }
    });
    document.getElementById("viewer").addEventListener("click", e => { if (e.target === e.currentTarget) closeViewer(); });
  </script>
