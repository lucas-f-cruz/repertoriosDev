<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Roteiro Litúrgico Musical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16130f;--ink2:#2a261e;--muted:#7a7165;--faint:#b0a898;
  --surface:#fffdf8;--soft:#faf6ee;--paper:#f4efe7;
  --border:rgba(42,37,31,.13);--border-s:rgba(42,37,31,.22);
  --gold:#b88b37;--gold-s:#ead7a5;--gold-bg:rgba(184,139,55,.08);
  --green:#2a7d52;--green-bg:rgba(42,125,82,.1);
  --blue:#2060a0;--blue-bg:rgba(32,96,160,.1);
  --danger:#9b3525;--r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;}
button,input,textarea{font:inherit;cursor:pointer;}
svg{flex-shrink:0;}

/* SCREENS */
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ── HOME ── */
#home{background:var(--ink);position:relative;overflow:hidden;align-items:center;justify-content:center;padding:2rem 1rem 3rem;}
.staff{position:absolute;left:0;right:0;pointer-events:none;top:50%;transform:translateY(-50%);height:110px;display:flex;flex-direction:column;justify-content:space-between;opacity:.06;}
.staff-line{height:1px;background:#ead7a5;width:100%;}
.clef-wrap{position:absolute;left:clamp(8px,4vw,56px);top:50%;transform:translateY(-58%);opacity:.12;pointer-events:none;}
.notes-deco{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:110px;pointer-events:none;opacity:.11;}
.home-inner{position:relative;z-index:2;text-align:center;max-width:500px;width:100%;}
.home-kicker{color:var(--gold-s);font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-bottom:.9rem;font-weight:400;}
.home-title{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,7vw,52px);font-weight:600;line-height:.95;color:#fff;margin-bottom:.4rem;}
.home-title em{font-style:italic;color:var(--gold-s);}
.home-date{color:rgba(234,215,165,.5);font-size:12px;letter-spacing:.8px;margin-bottom:2rem;font-weight:300;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-bottom:9px;}
.menu-btn{background:rgba(255,253,248,.05);border:1px solid rgba(234,215,165,.17);border-radius:11px;padding:1.2rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;color:#fff;transition:background .15s,border-color .15s,transform .13s;text-align:center;}
.menu-btn:hover{background:rgba(234,215,165,.09);border-color:rgba(234,215,165,.38);transform:translateY(-2px);}
.menu-btn:active{transform:translateY(0);}
.menu-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(234,215,165,.09);border:1px solid rgba(234,215,165,.18);font-size:19px;}
.menu-label{font-size:12px;font-weight:600;color:var(--gold-s);letter-spacing:.3px;}
.menu-desc{font-size:10px;color:rgba(255,255,255,.38);line-height:1.4;}
.menu-btn-wide{grid-column:1/-1;flex-direction:row;gap:.9rem;padding:1rem 1.25rem;align-items:center;text-align:left;}
.menu-util{display:flex;gap:9px;width:100%;}
.menu-util .menu-btn{flex:1;padding:.9rem .7rem;opacity:.72;}
.menu-util .menu-btn:hover{opacity:1;}

/* ── SUBPAGE SHELL ── */
.subpage-header{background:var(--ink);color:#fff;padding:11px 15px;display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--gold);flex-shrink:0;}
.back-btn{background:none;border:1px solid rgba(234,215,165,.26);border-radius:6px;color:var(--gold-s);padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .12s;flex-shrink:0;}
.back-btn:hover{background:rgba(234,215,165,.09);}
.back-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.subpage-title-block{flex:1;min-width:0;}
.subpage-kicker{color:var(--gold-s);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:1px;}
.subpage-h1{font-family:"Cormorant Garamond",serif;font-size:clamp(16px,3vw,24px);font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subpage-sub{display:block;color:#c8b880;font-size:11px;margin-top:2px;font-weight:300;}
.hbtn-cluster{display:flex;gap:0;border:1px solid rgba(234,215,165,.26);border-radius:7px;overflow:hidden;flex-shrink:0;}
.hbtn{background:none;color:var(--gold-s);border:none;border-left:1px solid rgba(234,215,165,.18);padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .12s;}
.hbtn:first-child{border-left:none;}
.hbtn:hover{background:rgba(234,215,165,.09);}
.hbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hep{display:none;background:#1e1b16;border-bottom:1px solid rgba(234,215,165,.1);}
.hep.open{display:block;}
.hep-inner{max-width:960px;margin:0 auto;padding:9px 15px;display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap;}
.hep-f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
.hep-f label{color:var(--faint);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;}
.hep-f input{border:1px solid rgba(234,215,165,.24);border-radius:6px;background:rgba(255,253,248,.06);color:#fff;padding:6px 9px;outline:none;width:100%;}
.hep-f input:focus{border-color:var(--gold);}
.save-hep{background:var(--gold);color:var(--ink);border:none;border-radius:6px;padding:6px 13px;font-size:11px;font-weight:700;}

/* ── REP PAGE ── */
.rep-page{max-width:960px;width:100%;margin:0 auto;padding:10px 13px;flex:1;overflow-y:auto;}
.topline{display:flex;align-items:center;justify-content:space-between;gap:7px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:7px;flex-wrap:wrap;}
.tl-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tl-label{font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:600;}
.tl-edit-wrap{display:none;align-items:center;gap:5px;}
.tl-edit-wrap.open{display:flex;}
.tl-edit-wrap input{border:1px solid var(--border-s);border-radius:6px;background:var(--surface);color:var(--ink);padding:4px 7px;outline:none;font-size:12px;width:140px;}
.tl-right{display:flex;gap:0;border:1px solid var(--border-s);border-radius:7px;overflow:hidden;flex-shrink:0;}
.tlbtn{background:rgba(255,253,248,.8);color:var(--muted);border:none;border-left:1px solid var(--border);padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .12s,color .12s;}
.tlbtn:first-child{border-left:none;}
.tlbtn:hover{background:var(--surface);color:var(--ink);}
.tlbtn.gold{color:var(--gold);font-weight:600;}
.tlbtn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── SONG LIST ── */
.repertoire{display:flex;flex-direction:column;gap:3px;}
.song-row{display:grid;grid-template-columns:50px minmax(0,1fr) 156px;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:7px;overflow:hidden;transition:border-color .14s,box-shadow .14s;}
.song-row:hover{border-color:rgba(184,139,55,.3);box-shadow:0 2px 8px rgba(24,22,18,.07);}
.song-row.done{opacity:.5;}
.song-row.done .song-title{text-decoration:line-through;color:var(--faint);}
.num-block{background:linear-gradient(180deg,#27241e,#151310);color:#fff;border-right:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s;}
.num-block:hover{background:linear-gradient(180deg,#332f27,#1e1b15);}
.chk{width:14px;height:14px;border:1.5px solid rgba(234,215,165,.38);border-radius:3px;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.chk svg{width:9px;height:9px;stroke:var(--gold-s);opacity:0;transition:opacity .12s;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.song-row.done .chk{background:var(--gold);border-color:var(--gold);}
.song-row.done .chk svg{opacity:1;}
.num-val{font-family:"Cormorant Garamond",serif;font-size:18px;line-height:1;font-weight:600;}
.song-main{padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;}
.pill{display:inline-block;border:1px solid rgba(93,110,77,.2);background:rgba(93,110,77,.07);color:#4a5c3c;border-radius:999px;padding:1px 7px;font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;width:fit-content;}
.song-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-title.empty{color:var(--faint);font-style:italic;font-weight:400;}
.song-tools{border-left:1px solid var(--border);display:grid;grid-template-rows:1fr 1fr;background:rgba(250,246,238,.5);}
.pdf-btns,.row-btns{display:grid;grid-template-columns:1fr 1fr;}
.pdf-btns{border-bottom:1px solid var(--border);}
.btn-letra,.btn-cifra,.btn-edit,.btn-clear{min-height:26px;border:none;background:transparent;font-size:11px;font-weight:600;transition:background .12s,color .12s;}
.btn-letra{color:var(--green);}
.btn-letra:hover{background:var(--green-bg);}
.btn-cifra{color:var(--blue);border-left:1px solid var(--border);}
.btn-cifra:hover{background:var(--blue-bg);}
.btn-edit{color:var(--muted);}
.btn-edit:hover{background:var(--paper);color:var(--ink);}
.btn-clear{color:rgba(155,53,37,.55);border-left:1px solid var(--border);}
.btn-clear:hover{background:#fff0ed;color:var(--danger);}
.song-edit{display:none;grid-column:1/-1;border-top:1px solid var(--border);background:var(--soft);padding:9px 11px;gap:6px;flex-wrap:wrap;align-items:flex-end;}
.song-row.editing .song-edit{display:flex;}
.se-f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
.se-f label,.ug label{color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.se-f input{border:1px solid var(--border-s);border-radius:6px;background:var(--surface);color:var(--ink);padding:5px 8px;outline:none;width:100%;}
.se-f input:focus{border-color:var(--gold);}
.ug{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
.file-input{border:1px dashed var(--border-s);background:var(--surface);border-radius:6px;padding:5px 8px;color:var(--muted);font-size:10px;width:100%;}
.hint{font-size:9px;color:var(--faint);}
.save-btn{background:var(--ink);color:var(--gold-s);border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;white-space:nowrap;align-self:flex-end;}
.save-btn:hover{background:var(--ink2);}

/* ── PDF VIEWER ── */
.viewer{display:none;position:fixed;inset:0;z-index:50;background:rgba(18,16,12,.76);align-items:center;justify-content:center;padding:12px;}
.viewer.open{display:flex;}
.vbox{width:100%;max-width:840px;height:min(92vh,840px);background:var(--surface);border:1px solid rgba(234,215,165,.35);border-radius:12px;box-shadow:0 28px 80px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;}
.vhead{background:var(--ink);color:#fff;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:9px;border-bottom:1px solid rgba(234,215,165,.35);flex-shrink:0;}
.vhead-info h3{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600;line-height:1;}
.vhead-info p{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-s);margin-top:2px;}
.vok{background:var(--gold);color:var(--ink);border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:700;flex-shrink:0;transition:opacity .12s;}
.vok:hover{opacity:.85;}
.pdf-frame{flex:1;width:100%;border:0;background:#ebe9e3;display:block;}
.empty-view{flex:1;display:grid;place-items:center;color:var(--muted);font-family:"Cormorant Garamond",serif;font-size:20px;text-align:center;padding:24px;}

/* ── HISTÓRICO ── */
.hist-list{display:flex;flex-direction:column;gap:7px;}
.hist-empty{color:var(--faint);font-family:"Cormorant Garamond",serif;font-size:18px;text-align:center;padding:3rem;font-style:italic;}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .13s,box-shadow .13s;}
.hist-card:hover{border-color:rgba(184,139,55,.35);box-shadow:0 2px 10px rgba(24,22,18,.08);}
.hist-num{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;color:var(--gold);min-width:34px;text-align:center;line-height:1;}
.hist-divider{width:1px;height:34px;background:var(--border);}
.hist-body{flex:1;min-width:0;}
.hist-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-actions{display:flex;gap:5px;flex-shrink:0;}
.hist-del{background:none;border:1px solid rgba(155,53,37,.22);border-radius:5px;padding:4px 8px;color:rgba(155,53,37,.55);font-size:10px;transition:background .12s,color .12s;}
.hist-del:hover{background:#fff0ed;color:var(--danger);}

/* ── CALENDÁRIO ── */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cal-head{background:var(--ink);color:#fff;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;}
.cal-head span{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:600;}
.cal-nav{background:none;border:1px solid rgba(234,215,165,.23);border-radius:5px;color:var(--gold-s);padding:4px 10px;font-size:13px;transition:background .12s;}
.cal-nav:hover{background:rgba(234,215,165,.09);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
.cal-dow span{text-align:center;padding:6px 2px;font-size:9px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:46px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:5px 2px;gap:2px;cursor:pointer;transition:background .12s;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day.other-month .cal-day-num{color:var(--faint);}
.cal-day.today{background:var(--gold-bg);}
.cal-day.today .cal-day-num{color:var(--gold);font-weight:700;}
.cal-day.has-event::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);display:block;}
.cal-day:hover{background:rgba(184,139,55,.07);}
.cal-day-num{font-size:13px;font-weight:500;line-height:1;}
.event-panel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px;display:none;margin-top:12px;}
.event-panel.open{display:block;}
.event-panel h3{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.ep-row{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap;}
.ep-f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px;}
.ep-f label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.ep-f input{border:1px solid var(--border-s);border-radius:6px;background:var(--soft);color:var(--ink);padding:6px 9px;outline:none;width:100%;font-size:13px;}
.ep-btns{display:flex;gap:6px;flex-shrink:0;}
.btn-ep-go{background:var(--ink);color:var(--gold-s);border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;}
.btn-ep-cancel{background:none;border:1px solid var(--border-s);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink2);color:#fff;border:1px solid rgba(234,215,165,.25);border-radius:8px;padding:8px 18px;font-size:12px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── LOADING OVERLAY ── */
.loading{display:none;position:fixed;inset:0;z-index:998;background:rgba(22,19,15,.55);align-items:center;justify-content:center;}
.loading.show{display:flex;}
.spinner{width:36px;height:36px;border:3px solid rgba(234,215,165,.2);border-top-color:var(--gold-s);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .menu-grid{grid-template-columns:1fr;}
  .menu-btn-wide{grid-column:auto;}
  .song-row{grid-template-columns:46px 1fr;}
  .song-tools{grid-column:1/-1;border-left:none;border-top:1px solid var(--border);}
  .song-title{white-space:normal;font-size:12px;}
  .num-val{font-size:15px;}
  .cal-day{min-height:36px;padding:4px 2px;}
  .cal-day-num{font-size:11px;}
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading"><div class="spinner"></div></div>
<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ══ HOME ══ -->
<div class="screen active" id="home">
  <div class="staff" aria-hidden="true">
    <div class="staff-line"></div><div class="staff-line"></div><div class="staff-line"></div>
    <div class="staff-line"></div><div class="staff-line"></div>
  </div>
  <div class="clef-wrap" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="185" viewBox="0 0 90 200" fill="none">
      <path d="M45 10 C45 10 25 35 25 70 C25 95 38 108 50 115 C38 122 20 138 20 162 C20 182 33 196 48 196 C63 196 76 184 76 168 C76 150 63 140 50 132 C50 132 68 120 68 95 C68 72 55 52 45 38 L45 10Z" stroke="#ead7a5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="168" r="12" stroke="#ead7a5" stroke-width="3"/>
      <path d="M44 156 C44 156 35 148 35 138 C35 125 44 118 50 115" stroke="#ead7a5" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="clef-wrap" aria-hidden="true" style="left:auto;right:clamp(8px,4vw,56px);transform:translateY(-58%) scaleX(-1);opacity:.07;">
    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="185" viewBox="0 0 90 200" fill="none">
      <path d="M45 10 C45 10 25 35 25 70 C25 95 38 108 50 115 C38 122 20 138 20 162 C20 182 33 196 48 196 C63 196 76 184 76 168 C76 150 63 140 50 132 C50 132 68 120 68 95 C68 72 55 52 45 38 L45 10Z" stroke="#ead7a5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="168" r="12" stroke="#ead7a5" stroke-width="3"/>
    </svg>
  </div>
  <svg class="notes-deco" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" preserveAspectRatio="none">
    <ellipse cx="180" cy="78" rx="8" ry="6" fill="#ead7a5" transform="rotate(-15,180,78)"/>
    <line x1="188" y1="74" x2="188" y2="28" stroke="#ead7a5" stroke-width="2"/>
    <ellipse cx="290" cy="66" rx="8" ry="6" fill="#ead7a5" transform="rotate(-15,290,66)"/>
    <line x1="298" y1="62" x2="298" y2="16" stroke="#ead7a5" stroke-width="2"/>
    <line x1="188" y1="28" x2="298" y2="18" stroke="#ead7a5" stroke-width="4"/>
    <ellipse cx="420" cy="82" rx="8" ry="6" fill="#ead7a5" transform="rotate(-15,420,82)"/>
    <line x1="428" y1="78" x2="428" y2="32" stroke="#ead7a5" stroke-width="2"/>
    <ellipse cx="530" cy="60" rx="8" ry="6" fill="#ead7a5" transform="rotate(-15,530,60)"/>
    <line x1="538" y1="56" x2="538" y2="10" stroke="#ead7a5" stroke-width="2"/>
    <line x1="428" y1="32" x2="538" y2="12" stroke="#ead7a5" stroke-width="4"/>
    <ellipse cx="660" cy="76" rx="8" ry="6" fill="#ead7a5" transform="rotate(-15,660,76)"/>
    <line x1="668" y1="72" x2="668" y2="26" stroke="#ead7a5" stroke-width="2"/>

<script>
/* ═══════════════════════════════════════
   SUPABASE CONFIG
   ═══════════════════════════════════════ */
const SB_URL = "https://bmwsajjaqockpfzckude.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtd3NhamphcW9ja3BmemNrdWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTYzNjUsImV4cCI6MjA5NTkzMjM2NX0.ZE7YiPCm5ybvYwPYD63MgLsHze-2t0oq5sdvtQqBc98";

async function sbFetch(path, opts={}){
  const res = await fetch(SB_URL + path, {
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation",...(opts.headers||{})},
    ...opts
  });
  if(!res.ok){ const e=await res.text(); throw new Error(e); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

/* ═══════════════════════════════════════
   INDEXEDDB — PDFs only
   ═══════════════════════════════════════ */
const DB_NAME="rlm-pdfs", STORE_PDF="pdfs";
function openDb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE_PDF);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function idbSave(key,file){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE_PDF,"readwrite");tx.objectStore(STORE_PDF).put(file,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbGet(key){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE_PDF,"readonly");const r=tx.objectStore(STORE_PDF).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}
async function idbDel(key){const db=await openDb();const tx=db.transaction(STORE_PDF,"readwrite");tx.objectStore(STORE_PDF).delete(key);}

/* ═══════════════════════════════════════
   STATE
   ═══════════════════════════════════════ */
const MOMENTOS_DEFAULT=["Invocação","Acolhida","Entrada","Ato Penitencial","Glória","Bíblia / Entrada","Aclamação","Ladainha","Ofertório","Santo","Cordeiro","Comunhão I","Comunhão II / Ação de Graças","Final"];
function makeFreshSongs(){return MOMENTOS_DEFAULT.map((m,i)=>({id:i+1,momento:m,titulo:""}));}

let history=[];           /* list of rep summaries from supabase */
let curSongs=[];
let curPdfMeta={};
let curDone={};
let curRepId=null;        /* supabase row id (bigint) */
let curOpenEd=null;
let curNextId=15;
let autoSaveTimer=null;

const MONTHS_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const now=new Date();
let calYear=now.getFullYear(), calMonth=now.getMonth();
let selectedCalDate=null;

/* home date */
document.getElementById("homeDate").textContent=
  now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/^\w/,c=>c.toUpperCase());

/* ═══════════════════════════════════════
   UI HELPERS
   ═══════════════════════════════════════ */
let toastTimer=null;
function showToast(msg,type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.borderColor=type==="err"?"var(--danger)":type==="auto"?"var(--green)":"var(--gold)";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2800);
}
function showLoading(v){document.getElementById("loading").classList.toggle("show",v);}

/* ═══════════════════════════════════════
   SCREENS
   ═══════════════════════════════════════ */
function goScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
  if(id==="eventos") renderCal();
}
function goHome(){goScreen("home");}

async function goHistorico(){
  goScreen("historico");
  await loadHistory();
}

function goNewRepertorio(){
  curRepId=null;curSongs=makeFreshSongs();curPdfMeta={};curDone={};curOpenEd=null;curNextId=15;
  setRepHeader("Novo Repertório","");
  document.getElementById("celebLabel").textContent="Celebração";
  document.getElementById("hep").classList.remove("open");
  goScreen("repertorio");render();
}

async function goFromEvent(){
  const name=document.getElementById("epName").value.trim();
  const dateStr=selectedCalDate?fmtDate(selectedCalDate):"";
  curRepId=null;curSongs=makeFreshSongs();curPdfMeta={};curDone={};curOpenEd=null;curNextId=15;
  setRepHeader(name||"Repertório",dateStr);
  document.getElementById("celebLabel").textContent="Celebração";
  document.getElementById("hep").classList.remove("open");
  closeEventPanel();
  goScreen("repertorio");render();
}

async function openRepertorio(id){
  showLoading(true);
  try{
    const rows=await sbFetch(`/rest/v1/repertorios?id=eq.${id}&select=*`);
    if(!rows.length) throw new Error("não encontrado");
    const rep=rows[0];
    curRepId=rep.id;
    curSongs=rep.songs||makeFreshSongs();
    curPdfMeta=rep.pdf_meta||{};
    curDone=rep.done||{};
    curOpenEd=null;
    curNextId=Math.max(...curSongs.map(s=>s.id),14)+1;
    setRepHeader(rep.titulo||"Repertório",rep.data_evento||"");
    document.getElementById("celebLabel").textContent=rep.celebracao||"Celebração";
    document.getElementById("hep").classList.remove("open");
    goScreen("repertorio");render();
  }catch(e){showToast("Erro ao carregar: "+e.message,"err");}
  finally{showLoading(false);}
}

/* ═══════════════════════════════════════
   HEADER
   ═══════════════════════════════════════ */
function setRepHeader(title,date){
  const node=document.getElementById("repTitle");
  node.childNodes[0].textContent=title;
  document.getElementById("repDate").textContent=date;
}
function toggleHep(){
  const p=document.getElementById("hep");p.classList.toggle("open");
  if(p.classList.contains("open")){
    document.getElementById("hfTitle").value=document.getElementById("repTitle").childNodes[0].textContent.trim();
    document.getElementById("hfDate").value=document.getElementById("repDate").textContent.trim();
  }
}
function saveHeaderInfo(){
  setRepHeader(document.getElementById("hfTitle").value.trim()||"Repertório",document.getElementById("hfDate").value.trim());
  document.getElementById("hep").classList.remove("open");
  scheduleAutoSave();
}
function toggleCelebEdit(){
  const w=document.getElementById("celebEditWrap");
  if(w.classList.toggle("open")) document.getElementById("celebInput").value=document.getElementById("celebLabel").textContent.trim();
}
function saveCeleb(){
  const v=document.getElementById("celebInput").value.trim();
  if(v) document.getElementById("celebLabel").textContent=v;
  document.getElementById("celebEditWrap").classList.remove("open");
  scheduleAutoSave();
}

/* ═══════════════════════════════════════
   SUPABASE SAVE / LOAD
   ═══════════════════════════════════════ */
function buildPayload(){
  return {
    titulo:document.getElementById("repTitle").childNodes[0].textContent.trim()||"Repertório",
    data_evento:document.getElementById("repDate").textContent.trim(),
    celebracao:document.getElementById("celebLabel").textContent.trim(),
    songs:curSongs,
    pdf_meta:curPdfMeta,
    done:curDone,
    atualizado_em:new Date().toISOString()
  };
}

async function saveRepertorio(){
  showLoading(true);
  try{
    const payload=buildPayload();
    if(curRepId){
      await sbFetch(`/rest/v1/repertorios?id=eq.${curRepId}`,{method:"PATCH",body:JSON.stringify(payload)});
    } else {
      const rows=await sbFetch("/rest/v1/repertorios",{method:"POST",body:JSON.stringify(payload)});
      if(rows&&rows[0]) curRepId=rows[0].id;
    }
    showToast(`✓ "${payload.titulo}" salvo!`,"ok");
  }catch(e){showToast("Erro ao salvar: "+e.message,"err");}
  finally{showLoading(false);}
}

function scheduleAutoSave(){
  if(!curSongs.some(s=>s.titulo)) return; /* não salva vazio */
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(async()=>{
    try{
      const payload=buildPayload();
      if(curRepId){
        await sbFetch(`/rest/v1/repertorios?id=eq.${curRepId}`,{method:"PATCH",body:JSON.stringify(payload)});
        showToast("💾 Salvo automaticamente","auto");
      } else {
        const rows=await sbFetch("/rest/v1/repertorios",{method:"POST",body:JSON.stringify(payload)});
        if(rows&&rows[0]) curRepId=rows[0].id;
        showToast("💾 Salvo automaticamente","auto");
      }
    }catch(e){}
  },2000);
}

async function loadHistory(){
  showLoading(true);
  try{
    history=await sbFetch("/rest/v1/repertorios?select=id,titulo,data_evento,celebracao,atualizado_em&order=atualizado_em.desc");
    renderHist();
  }catch(e){showToast("Erro ao carregar histórico","err");}
  finally{showLoading(false);}
}

/* ═══════════════════════════════════════
   RENDER SONG LIST
   ═══════════════════════════════════════ */
function pad(n){return String(n).padStart(2,"0");}
function render(){
  const list=document.getElementById("songList");list.innerHTML="";
  curSongs.forEach((song,idx)=>{
    const isDone=!!curDone[song.id];
    const lOk=!!curPdfMeta[pk(song.id,"letra")];
    const cOk=!!curPdfMeta[pk(song.id,"cifra")];
    const row=document.createElement("article");
    row.className="song-row"+(curOpenEd===song.id?" editing":"")+(isDone?" done":"");
    row.innerHTML=`
      <div class="num-block" onclick="toggleDone(${song.id})" title="Marcar como tocada">
        <div class="chk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="num-val">${pad(idx+1)}</div>
      </div>
      <div class="song-main">
        <span class="pill">${esc(song.momento)}</span>
        <div class="song-title ${song.titulo?"":"empty"}">${esc(song.titulo||"nome da música")}</div>
      </div>
      <div class="song-tools">
        <div class="pdf-btns">
          <button class="btn-letra" onclick="openPdf(${song.id},'letra')">Letra</button>
          <button class="btn-cifra" onclick="openPdf(${song.id},'cifra')">Cifra</button>
        </div>
        <div class="row-btns">
          <button class="btn-edit" onclick="toggleEdit(${song.id})">Editar</button>
          <button class="btn-clear" onclick="clearSong(${song.id})">Limpar</button>
        </div>
      </div>
      <div class="song-edit">
        <div class="se-f"><label>Momento</label><input id="m-${song.id}" value="${escA(song.momento)}"></div>
        <div class="se-f"><label>Nome da música</label><input id="t-${song.id}" value="${escA(song.titulo)}" placeholder="Nome da música"></div>
        <div class="ug"><label>PDF Letra</label>
          <input class="file-input" type="file" accept="application/pdf" onchange="attachPdf(${song.id},'letra',this.files[0])">
          <span class="hint">${lOk?esc(curPdfMeta[pk(song.id,"letra")].name):"Nenhum PDF."}</span>
        </div>
        <div class="ug"><label>PDF Cifra</label>
          <input class="file-input" type="file" accept="application/pdf" onchange="attachPdf(${song.id},'cifra',this.files[0])">
          <span class="hint">${cOk?esc(curPdfMeta[pk(song.id,"cifra")].name):"Nenhum PDF."}</span>
        </div>
        <button class="save-btn" onclick="saveSong(${song.id})">Salvar</button>
      </div>`;
    list.appendChild(row);
  });
}

function toggleDone(id){curDone[id]=!curDone[id];render();scheduleAutoSave();}
function addSong(){
  curSongs.push({id:curNextId++,momento:"Novo momento",titulo:""});
  curOpenEd=curSongs[curSongs.length-1].id;render();
  document.querySelector(".song-row.editing")?.scrollIntoView({behavior:"smooth",block:"center"});
}
function toggleEdit(id){curOpenEd=curOpenEd===id?null:id;render();}
function saveSong(id){
  const s=curSongs.find(x=>x.id===id);if(!s)return;
  s.momento=document.getElementById(`m-${id}`).value.trim()||s.momento;
  s.titulo=document.getElementById(`t-${id}`).value.trim();
  curOpenEd=null;render();scheduleAutoSave();
}
function clearSong(id){
  if(!confirm("Limpar nome e PDFs desta música?"))return;
  const s=curSongs.find(x=>x.id===id);if(s)s.titulo="";
  delete curDone[id];
  delete curPdfMeta[pk(id,"letra")];delete curPdfMeta[pk(id,"cifra")];
  idbDel(pk(id,"letra"));idbDel(pk(id,"cifra"));
  render();scheduleAutoSave();
}
function pk(id,t){return `${id}-${t}`;}

/* ═══════════════════════════════════════
   PDF
   ═══════════════════════════════════════ */
async function attachPdf(id,type,file){
  if(!file)return;
  if(file.type!=="application/pdf"){showToast("Escolha um arquivo PDF.","err");return;}
  const key=pk(id,type);
  await idbSave(key,file);
  curPdfMeta[key]={name:file.name,updated:new Date().toISOString()};
  render();scheduleAutoSave();
}
async function openPdf(id,type){
  const s=curSongs.find(x=>x.id===id);
  document.getElementById("vTitle").textContent=s?.titulo||s?.momento||"Música";
  document.getElementById("vMeta").textContent=`${s?.momento||""} · ${type==="letra"?"Letra":"Cifra"}`;
  document.getElementById("viewer").classList.add("open");
  const blob=await idbGet(pk(id,type));
  const frame=document.getElementById("pdfFrame");
  const empty=document.getElementById("emptyView");
  if(blob){frame.src=URL.createObjectURL(blob);frame.style.display="block";empty.style.display="none";}
  else{frame.removeAttribute("src");frame.style.display="none";empty.style.display="grid";}
}
function closeViewer(){
  document.getElementById("viewer").classList.remove("open");
  const f=document.getElementById("pdfFrame");
  if(f.src&&f.src.startsWith("blob:"))URL.revokeObjectURL(f.src);
  f.removeAttribute("src");
}

/* ═══════════════════════════════════════
   HISTÓRICO RENDER
   ═══════════════════════════════════════ */
function renderHist(){
  const el=document.getElementById("histList");el.innerHTML="";
  if(!history.length){el.innerHTML='<p class="hist-empty">Nenhum repertório salvo ainda.</p>';return;}
  history.forEach((rep,i)=>{
    const card=document.createElement("div");card.className="hist-card";
    const d=rep.atualizado_em?new Date(rep.atualizado_em).toLocaleDateString("pt-BR"):"";
    card.innerHTML=`
      <div class="hist-num">${pad(i+1)}</div>
      <div class="hist-divider"></div>
      <div class="hist-body">
        <div class="hist-title">${esc(rep.titulo||"Repertório")}</div>
        <div class="hist-meta">${esc(rep.data_evento||"")}${rep.data_evento&&d?" · ":""}${d?"Salvo "+d:""}</div>
      </div>
      <div class="hist-actions">
        <button class="hist-del" onclick="delHist(${rep.id},event)">Excluir</button>
      </div>`;
    card.addEventListener("click",()=>openRepertorio(rep.id));
    el.appendChild(card);
  });
}
async function delHist(id,e){
  e.stopPropagation();
  if(!confirm("Excluir este repertório?"))return;
  showLoading(true);
  try{
    await sbFetch(`/rest/v1/repertorios?id=eq.${id}`,{method:"DELETE"});
    history=history.filter(r=>r.id!==id);renderHist();
    showToast("Repertório excluído","ok");
  }catch(err){showToast("Erro ao excluir","err");}
  finally{showLoading(false);}
}

/* ═══════════════════════════════════════
   CALENDÁRIO
   ═══════════════════════════════════════ */
function fmtDate(d){return d.toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();}

async function renderCal(){
  document.getElementById("calMonthLabel").textContent=`${MONTHS_PT[calMonth]} ${calYear}`;
  /* load events for this month from supabase */
  let evDates=new Set();
  try{
    const rows=await sbFetch("/rest/v1/repertorios?select=data_evento&data_evento=not.is.null");
    rows.forEach(r=>{ if(r.data_evento) evDates.add(r.data_evento); });
  }catch(e){}
  const grid=document.getElementById("calGrid");grid.innerHTML="";
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const todayStr=`${now.getDate()} de ${MONTHS_PT[now.getMonth()].toLowerCase()} de ${now.getFullYear()}`;
  let cells=[];
  for(let i=firstDay-1;i>=0;i--) cells.push({day:daysInPrev-i,cur:false,d:new Date(calYear,calMonth-1,daysInPrev-i)});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,cur:true,d:new Date(calYear,calMonth,d)});
  while(cells.length<42) cells.push({day:cells.length-firstDay-daysInMonth+1,cur:false,d:new Date(calYear,calMonth+1,cells.length-firstDay-daysInMonth+1)});
  cells.forEach(c=>{
    const label=fmtDate(c.d);
    const isToday=label===todayStr;
    const hasEv=evDates.has(label);
    const div=document.createElement("div");
    div.className="cal-day"+(c.cur?"":" other-month")+(isToday?" today":"")+(hasEv?" has-event":"");
    div.innerHTML=`<span class="cal-day-num">${c.day}</span>`;
    div.addEventListener("click",()=>onCalDayClick(c.d));
    grid.appendChild(div);
  });
}

function onCalDayClick(date){
  selectedCalDate=date;
  const panel=document.getElementById("eventPanel");
  document.getElementById("eventPanelTitle").textContent=`Evento em ${fmtDate(date)}`;
  document.getElementById("epName").value="";
  panel.classList.add("open");
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function closeEventPanel(){document.getElementById("eventPanel").classList.remove("open");selectedCalDate=null;}

/* ═══════════════════════════════════════
   EXPORT / IMPORT
   ═══════════════════════════════════════ */
async function exportBackup(){
  showLoading(true);
  try{
    const rows=await sbFetch("/rest/v1/repertorios?select=*&order=atualizado_em.desc");
    /* embed PDFs as base64 */
    const pdfStore={};
    for(const rep of rows){
      for(const song of (rep.songs||[])){
        for(const type of ["letra","cifra"]){
          const key=`${song.id}-${type}`;
          if(rep.pdf_meta&&rep.pdf_meta[key]){
            try{
              const blob=await idbGet(key);
              if(blob){
                const ab=await blob.arrayBuffer();
                const bytes=new Uint8Array(ab);
                let b64="";for(let i=0;i<bytes.byteLength;i++) b64+=String.fromCharCode(bytes[i]);
                pdfStore[key]={data:btoa(b64),name:rep.pdf_meta[key].name};
              }
            }catch(e){}
          }
        }
      }
    }
    const backup={version:3,exportedAt:new Date().toISOString(),repertorios:rows,pdfStore};
    const blob=new Blob([JSON.stringify(backup)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date();
    a.href=url;a.download=`roteiro-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    a.click();URL.revokeObjectURL(url);
    showToast("✓ Backup exportado!","ok");
  }catch(e){showToast("Erro ao exportar","err");}
  finally{showLoading(false);}
}

function importBackup(){
  const input=document.createElement("input");input.type="file";input.accept="application/json";
  input.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    showLoading(true);
    try{
      const text=await file.text();
      const backup=JSON.parse(text);
      const list=backup.repertorios||backup.history||[];
      if(!list.length) throw new Error("Arquivo sem repertórios");
      if(!confirm(`Importar ${list.length} repertório(s) para o Supabase?`)){showLoading(false);return;}
      let added=0;
      for(const rep of list){
        try{
          /* map old format if needed */
          const payload={
            titulo:rep.titulo||rep.title||"Repertório",
            data_evento:rep.data_evento||rep.date||"",
            celebracao:rep.celebracao||rep.celeb||"Celebração",
            songs:rep.songs||[],
            pdf_meta:rep.pdf_meta||rep.pdfMeta||{},
            done:rep.done||{}
          };
          await sbFetch("/rest/v1/repertorios",{method:"POST",body:JSON.stringify(payload),headers:{"Prefer":"return=minimal"}});
          added++;
        }catch(err){}
      }
      /* restore PDFs */
      if(backup.pdfStore){
        for(const [key,val] of Object.entries(backup.pdfStore)){
          try{
            const binary=atob(val.data);const bytes=new Uint8Array(binary.length);
            for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
            const blob=new Blob([bytes],{type:"application/pdf"});
            await idbSave(key,new File([blob],val.name,{type:"application/pdf"}));
          }catch(e){}
        }
      }
      showToast(`✓ ${added} repertório(s) importado(s)!`,"ok");
    }catch(err){showToast("Arquivo inválido","err");}
    finally{showLoading(false);}
  };
  input.click();
}

   UTILS

function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escA(v){return esc(v).replace(/"/g,"&quot;");}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();});
document.getElementById("viewer").addEventListener("click",e=>{if(e.target===e.currentTarget)closeViewer();});

document.querySelectorAll(".back-btn").forEach(b=>{});
